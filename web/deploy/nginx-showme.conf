# /etc/nginx/conf.d/showme.conf
# Web app (static build) at /, API (uvicorn) at /api. Same origin, so no CORS.
# certbot --nginx adds the HTTPS server block once the domain points here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # default_server catches the bare IP and any host; certbot adds the domain.
    server_name showme;

    root /srv/showme/app/web/dist;
    index index.html;

    # Agent frames are 2-4 JPEGs; vision/ caps bodies at 12 MB.
    client_max_body_size 12m;

    # React Router: /new, /v/<token> are client-side routes.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
