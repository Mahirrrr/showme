# /etc/nginx/conf.d/showme.conf
# Web app (static build) at /, API (uvicorn) at /api. Same origin, so no CORS.
# TLS: Let's Encrypt via `certbot certonly --nginx -d showme.photo -d www.showme.photo`
# (certonly, so certbot never edits this file and deploy.sh can overwrite it safely).

# Everything on port 80 (bare IP, www, plain http) -> https://showme.photo
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name showme.photo www.showme.photo;
    return 301 https://showme.photo$request_uri;
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.showme.photo;
    ssl_certificate     /etc/letsencrypt/live/showme.photo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showme.photo/privkey.pem;
    return 301 https://showme.photo$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name showme.photo;

    ssl_certificate     /etc/letsencrypt/live/showme.photo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showme.photo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=86400" always;

    root /srv/showme/app/web/dist;
    index index.html;

    # Agent frames are 2-4 JPEGs; vision/ caps bodies at 12 MB.
    client_max_body_size 12m;

    # React Router: /new, /v/<token> are client-side routes.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
